spring:
  application:
    name: microservice2
    
  sleuth:
    enabled: true
    sampler:
      probability: 1.0 # Ensures all requests are traced
  zipkin:
    base-url: http://localhost:9411 # Location of your Zipkin Server

  datasource:
    url: jdbc:h2:mem:microservice2db
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        connection:
          autocommit: false
        format_sql: true

server:
  port: 8081

microservice1:
  hello-url: lb://MICROSERVICE1/microservice1/hello
  grpc-server: localhost:9090

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG # Optional, for verbose tracing info
    management:
      metrics:
        export:
          influx:
            enabled: true
            db: micrometer
            uri: http://localhost:8686 # Replace with your InfluxDB URL
            user-name: user
            password: password

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
