spring:
  application:
    name: microservice2
    
  sleuth:
    enabled: true
    sampler:
      probability: 1.0 # Ensures all requests are traced
  zipkin:
    base-url: http://localhost:9411 # Location of your Zipkin Server

  datasource:
    url: jdbc:h2:mem:microservice2db
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        connection:
          autocommit: false
        format_sql: true

server:
  port: 8081

microservice1:
  hello-url: lb://MICROSERVICE1/microservice1/hello
  grpc-server: localhost:9090

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG # Optional, for verbose tracing info

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  influx:
    metrics:
      export:
        enabled: true
        uri: http://localhost:8686
        db: my-metrics-db
        user-name: myuser
        password: mypassword
        step: 10s

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
