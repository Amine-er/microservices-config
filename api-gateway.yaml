spring:
  application:
    name: api-gateway
    
  sleuth:
    enabled: true
    sampler:
      probability: 1.0 # Ensures all requests are traced
  zipkin:
    base-url: http://localhost:9411 # Location of your Zipkin Server
    
  cloud:
    gateway:
      routes:
        - id: microservice1
          uri: lb://MICROSERVICE1
          predicates:
            - Path=/microservice1/**
          filters:
            - RoleValidationFilter
        - id: swagger-ui
          uri: lb://MICROSERVICE1
          predicates:
            - Path=/openapi/**
        - id: microservice2
          uri: lb://MICROSERVICE2
          predicates:
            - Path=/microservice2/**

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG # Optional, for verbose tracing info

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  influx:
    metrics:
      export:
        enabled: true
        uri: http://localhost:8686
        db: my-metrics-db
        user-name: myuser
        password: mypassword
        step: 10s
        
server:
  port: 8086

role-validation:
  enabled: false
  required-role: microservice1
  client-name: myclient

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

