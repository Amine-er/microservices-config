spring:
  application:
    name: api-gateway
    
  cloud:
    gateway:
      routes:
        - id: microservice1
          uri: lb://MICROSERVICE1
          predicates:
            - Path=/microservice1/**
          filters:
            - RoleValidationFilter
        - id: swagger-ui
          uri: lb://MICROSERVICE1
          predicates:
            - Path=/openapi/**
        - id: microservice2
          uri: lb://MICROSERVICE2
          predicates:
            - Path=/microservice2/**

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG # Optional, for verbose tracing info

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  influx:
    metrics:
      export:
        enabled: true
        db: micrometer
        uri: http://localhost:8686
        user-name: user
        password: password
        
server:
  port: 8086

role-validation:
  enabled: false
  required-role: microservice1
  client-name: myclient

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

