spring:
  application:
    name: product-service

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: schema1
    locations: classpath:db/migration
    
  datasource:
    url: jdbc:postgresql://postgres:5432/shared_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    
server:
  port: 8082
  forward-headers-strategy: framework

grpc:
  server:
    port: 9090


springdoc:
  swagger-ui.path: /openapi/swagger-ui.html
  api-docs.path: /openapi/v3/api-docs
  pathsToMatch: /**

logging:
  level:
    org.springframework.cloud.sleuth: DEBUG # Optional, for verbose tracing info

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  metrics:
    tracing:
      enabled: true
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  
eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
